<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SalesFlow CRM – All Roles</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#5B4BDB;--bg:#F7F8FC;--card:#fff;--ok:#16A36A;--warn:#F59E0B;--bad:#DC4C4C;--tx:#17233F;--tx2:#697386;--bd:#E6E9F0;--side:#17233F;--soft:#EEEBFD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--card:#172038;--tx:#EEF0F7;--tx2:#9AA3B8;--bd:#263250;--side:#0A0F1D;--soft:#26224F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1424;--card:#172038;--tx:#EEF0F7;--tx2:#9AA3B8;--bd:#263250;--side:#0A0F1D;--soft:#26224F;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
aside{position:fixed;inset:0 auto 0 0;width:232px;background:var(--side);color:#C9CFE0;padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:17px;padding:0 8px 16px}.logo i{width:30px;height:30px;border-radius:8px;background:var(--pri);display:grid;place-items:center;font-style:normal}
aside a{display:flex;gap:10px;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500}aside a.on{background:var(--pri);color:#fff}aside a:hover:not(.on){background:#ffffff14}
.me{margin-top:auto;padding:10px;font-size:12px;border-top:1px solid #ffffff22}
main{margin-left:232px;min-height:100vh}
header{display:flex;gap:14px;align-items:center;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header input,select{padding:8px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}header input{flex:1;max-width:340px}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.pg{padding:24px 28px;max-width:1300px}.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--tx2);margin:0 0 20px}h3{margin:0}
.grid{display:grid;gap:14px;margin-bottom:14px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:1.4fr 1fr}.pl{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}.kpi small{color:var(--tx2);display:block}.kpi b{font-size:25px}.kpi.w b{color:var(--bad)}.kpi.g b{color:var(--ok)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 13px;font:600 13px Inter,sans-serif;cursor:pointer}.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.g{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.s{padding:5px 9px;font-size:12px}.btn.d{color:var(--bad)}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.New{background:#E3EEFF;color:#2563EB}.Contacted{background:#EEEBFD;color:var(--pri)}.Interested{background:#DDF4F1;color:#0F8F86}.Follow-up,.Pending,.Trial{background:#FEF1D6;color:#B87503}.Converted,.Active,.Paid{background:#DDF5EA;color:var(--ok)}.Lost,.Overdue,.Expired,.Failed{background:#FBE4E4;color:var(--bad)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--tx2);font-weight:500;font-size:12px;padding:8px}td{padding:11px 8px;border-top:1px solid var(--bd)}.scroll{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-bottom:22px}.bars div{flex:1;background:var(--pri);border-radius:6px 6px 0 0;opacity:.85;position:relative}.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--tx2)}
.plan{position:relative}.plan.pop{border:2px solid var(--pri)}.plan .pr{font-size:30px;font-weight:700;margin:6px 0}.plan .pr small{font-size:13px;color:var(--tx2);font-weight:400}.plan ul{padding-left:18px;margin:10px 0 16px;color:var(--tx2)}.plan ul li{margin:4px 0}.plan .btn{width:100%;margin-top:6px}
.ribbon{position:absolute;top:-11px;right:14px;background:var(--pri);color:#fff;font-size:11px;font-weight:600;border-radius:20px;padding:2px 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--bd);border-radius:20px;padding:5px 12px;cursor:pointer;background:var(--card);color:var(--tx);font:500 13px Inter,sans-serif}.chip.on{background:var(--soft);border-color:var(--pri);color:var(--pri)}
textarea{width:100%;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--bg);color:var(--tx);font:inherit;min-height:64px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}.row>div:first-child{flex:1}.row small{color:var(--tx2);display:block}
.pb{height:8px;background:var(--bd);border-radius:5px;min-width:90px}.pb i{display:block;height:8px;background:var(--pri);border-radius:5px}
@media(max-width:820px){aside{inset:auto 0 0 0;width:auto;flex-direction:row;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:9}.logo,.me{display:none}aside a{flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:6px 4px}main{margin:0;padding-bottom:80px}header{padding:10px 14px}header input{display:none}.pg{padding:16px}.two{grid-template-columns:1fr}}
</style></head><body>
<aside id="sb"></aside>
<main><header><select id="rs" aria-label="View as role"><option value="sa">Super Admin</option><option value="bo">Business Owner</option><option value="mg">Manager</option><option value="se">Sales Executive</option></select><input placeholder="Search…"><span style="margin-left:auto">🔔</span><div class="av" id="av"></div></header><div id="app"></div></main>
<script>
const $=s=>document.querySelector(s);
const T=s=>`<span class="tag ${s}">${s}</span>`;
const K=a=>`<div class="grid k">${a.map(x=>`<div class="card kpi ${x[2]||""}"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")}</div>`;
const C=(t,b,x="")=>`<div class="card ${x}"><h2>${t}</h2>${b}</div>`;
const TB=(h,r)=>`<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const BR=a=>`<div class="bars">${a.map(x=>`<div style="height:${x[1]}%"><span>${x[0]}</span></div>`).join("")}</div>`;
const PG=(t,s,b,a="")=>`<div class="pg"><div class="hd"><div><h1>${t}</h1><p class="sub">${s}</p></div><div class="acts">${a}</div></div>${b}</div>`;
const btn=(t,c="")=>`<button class="btn ${c}">${t}</button>`;
const PL=[["Starter","₹1,999","Up to 5 users","500 leads / month","Facebook &amp; website forms","Basic reports","Email support"],["Professional","₹4,999","Up to 25 users","5,000 leads / month","All integrations incl. WhatsApp","Advanced reports &amp; exports","Priority support",1],["Enterprise","₹12,999","Unlimited users","Unlimited leads","Custom integrations &amp; API","Audit logs &amp; SSO","Dedicated manager"]];
const plans=m=>`<div class="grid pl">${PL.map(p=>`<div class="card plan ${p[7]?"pop":""}">${p[7]?'<span class="ribbon">Most popular</span>':""}<h3>${p[0]}</h3><div class="pr">${p[1]}<small> / month</small></div><ul>${p.slice(2,7).map(x=>`<li>${x}</li>`).join("")}</ul>${m=="sa"?btn("Edit plan")+btn("Deactivate","d"):p[0]=="Professional"?btn("Current plan"):btn(p[0]=="Starter"?"Downgrade":"Upgrade to "+p[0],"p")}</div>`).join("")}</div>`;
const LD=[["Rahul Kumar","Facebook","New","Arun Kumar"],["Priya Sharma","Instagram","Contacted","Sneha Kapoor"],["Amit Tiwari","Website","Interested","Arun Kumar"],["Sneha Kapoor","Google Forms","Follow-up","Priya Sharma"],["Vikram Singh","WhatsApp","Converted","Rahul Kumar"],["Neha Verma","Manual Entry","New","—"]];
const FU=[["Rahul Kumar","Call back about fees","Today 5:00 PM","Due Today"],["Amit Tiwari","Confirm campus visit","Today 4:30 PM","Due Today"],["Priya Sharma","Share brochure","Fri 10:30 AM","Upcoming"],["Sneha Kapoor","Discuss scholarship","2 days ago","Overdue"]];
const fu=()=>`<div class="card">${FU.map(x=>`<div class="row"><div><b>${x[0]}</b><small>${x[1]} · ${x[2]}</small></div>${T(x[3]=="Due Today"?"Follow-up":x[3]=="Upcoming"?"New":"Overdue")}${btn("Mark completed","s g")}${btn("Reschedule","s")}</div>`).join("")}</div>`;
const R={
sa:{n:"Super Admin",u:"Platform Owner",nav:[["dashboard","▦","Dashboard"],["orgs","🏢","Organizations"],["plans","💳","Plans"],["billing","🧾","Billing"]],v:{
dashboard:()=>PG("Platform overview","SalesFlow CRM · all organizations",K([["Total organizations",128],["Active organizations",112],["Active subscriptions",109,"g"],["Expired subscriptions",19,"w"],["Monthly recurring revenue","₹6.4L"],["Platform users","2,846"],["Leads processed","1.9M"],["Pending activations",7]])+`<div class="grid two">${C("MRR growth",BR([["Jun",45],["Jul",55],["Aug",62],["Sep",74],["Oct",88],["Nov",100]]))}${C("Plan mix",TB(["Plan","Orgs"],[["Starter",58],["Professional",51],["Enterprise",19]]))}</div>`),
orgs:()=>PG("Organizations","Manage every client on the platform",TB(["Organization","Plan","Users","Status","Renews"],[["ABC Education Institute","Professional",18,T("Active"),"12 Dec 2026"],["Bright Realty","Enterprise",64,T("Active"),"03 Jan 2027"],["Zen Fitness Club","Starter",4,T("Trial"),"Trial ends 30 Nov"],["Orbit Travels","Professional",22,T("Expired"),"Expired 15 Nov"],["Nova Insurance","Starter",5,T("Pending"),"Awaiting payment"]].map(r=>r.concat()))  ,btn("+ Create organization","p")),
plans:()=>PG("Subscription plans","Packages organizations can purchase",plans("sa")+C("Plan limits",TB(["Plan","Users","Leads / month","Integrations","Subscribers"],[["Starter",5,500,2,58],["Professional",25,"5,000",5,51],["Enterprise","Unlimited","Unlimited","All + API",19]])),btn("+ Create plan","p")),
billing:()=>PG("Billing &amp; payments","Latest subscription payments",TB(["Invoice","Organization","Plan","Amount","Status","Date"],[["INV-4821","ABC Education Institute","Professional","₹4,999",T("Paid"),"12 Nov"],["INV-4820","Bright Realty","Enterprise","₹12,999",T("Paid"),"03 Nov"],["INV-4819","Orbit Travels","Professional","₹4,999",T("Failed"),"15 Nov"],["INV-4818","Nova Insurance","Starter","₹1,999",T("Pending"),"20 Nov"]]),btn("Export CSV"))}},
bo:{n:"Business Owner",u:"ABC Education Institute",nav:[["dashboard","▦","Dashboard"],["team","👥","Team"],["integrations","🔌","Integrations"],["subscription","💳","Subscription"]],v:{
dashboard:()=>PG("Organization dashboard","ABC Education Institute",K([["Total leads","1,284"],["New leads",86],["Assigned leads","1,102"],["Converted leads",212,"g"],["Pending follow-ups",74],["Overdue follow-ups",11,"w"],["Meetings",39],["Conversion rate","16.5%"]])+`<div class="grid two">${C("Leads by source",BR([["FB",90],["IG",62],["Web",75],["Forms",40],["WA",55]]))}${C("Subscription usage",`<p>Professional plan</p><div class="pb"><i style="width:72%"></i></div><small>18 of 25 users · 3,610 of 5,000 leads</small><p>${btn("Upgrade plan","p")}</p>`)}</div>`),
team:()=>PG("Team management","Employees and roles",TB(["Name","Role","Leads","Status"],[["Arun Kumar","Sales Executive",48,T("Active")],["Priya Sharma","Sales Executive",41,T("Active")],["Rahul Kumar","Manager",0,T("Active")],["Sneha Kapoor","Sales Executive",37,T("Pending")]]),btn("+ Invite employee","p")),
integrations:()=>PG("Integrations","Connect lead sources",`<div class="grid pl">${[["Facebook Lead Ads","Active"],["Instagram Lead Ads","Active"],["Google Forms","Active"],["Website Forms","Active"],["WhatsApp Business","Pending"],["CSV / Excel import","Active"]].map(x=>C(x[0],`<p>${T(x[1])}</p>${btn(x[1]=="Active"?"Configure":"Connect","s")}`)).join("")}</div>`),
subscription:()=>PG("Subscription","Your plan renews on 12 Dec 2026. Choose the package that fits your team.",plans("bo")+C("Billing history",TB(["Invoice","Plan","Amount","Status"],[["INV-4821","Professional","₹4,999",T("Paid")],["INV-4602","Professional","₹4,999",T("Paid")],["INV-4390","Starter","₹1,999",T("Paid")]])))}},
mg:{n:"Manager",u:"Rahul Kumar · ABC Education",nav:[["dashboard","▦","Dashboard"],["leads","👥","Leads"],["performance","📈","Performance"],["meetings","📅","Meetings"]],v:{
dashboard:()=>PG("Manager dashboard","Your team’s progress today",K([["Team members",8],["Assigned leads",1102],["Unassigned leads",24,"w"],["Calls completed",142],["Pending follow-ups",74],["Overdue",11,"w"],["Meetings scheduled",16],["Converted",212,"g"],["Team conversion","16.5%"]])+C("Team performance",BR([["Arun",90],["Priya",74],["Rahul",60],["Sneha",82]]))),
leads:()=>PG("All leads &amp; assignment","24 leads waiting to be assigned",TB(["Lead","Source","Status","Assigned to","Action"],LD.map(x=>[x[0],x[1],T(x[2]),x[3]=="—"?"<select><option>Select executive</option><option>Arun Kumar</option><option>Priya Sharma</option><option>Sneha Kapoor</option></select>":x[3],btn(x[3]=="—"?"Assign":"Reassign","s p")]))),
performance:()=>PG("Employee performance","This month",TB(["Executive","Calls","Follow-ups done","Meetings","Converted","Rate"],[["Arun Kumar",212,"94%",14,9,"18%"],["Priya Sharma",188,"88%",11,7,"15%"],["Sneha Kapoor",176,"81%",9,6,"14%"],["Rahul Kumar",140,"90%",8,5,"13%"]]),btn("Weekly report")+btn("Monthly report")),
meetings:()=>PG("Meetings","Scheduled across the team",TB(["Time","Lead","Executive","Type","Status"],[["Today 4:30 PM","Amit Tiwari","Arun Kumar","Campus visit",T("New")],["Tomorrow 11:00 AM","Vikram Singh","Priya Sharma","Demo call",T("New")],["Fri 3:00 PM","Sneha Kapoor","Sneha Kapoor","Counselling",T("New")]]))}},
se:{n:"Sales Executive",u:"Arun Kumar · ABC Education",nav:[["dashboard","▦","Dashboard"],["leads","👥","My Leads"],["followups","⏰","Follow-ups"],["call","📞","Call"]],v:{
dashboard:()=>PG("Good morning, Arun","What needs your attention today",K([["My leads",48],["Calls today",12],["Due today",6],["Overdue",3,"w"],["Meetings",4],["Converted",9,"g"],["Tasks done",17]])+C("Due today",FU.slice(0,2).map(x=>`<div class="row"><div><b>${x[0]}</b><small>${x[1]} · ${x[2]}</small></div>${btn("Call Now","s p")}</div>`).join(""))),
leads:()=>PG("My leads","48 assigned to you",TB(["Lead","Source","Status","Action"],LD.filter(x=>x[3]=="Arun Kumar"||x[0]=="Sneha Kapoor").map(x=>[x[0],x[1],T(x[2]),btn("Call Now","s p")]))),
followups:()=>PG("Follow-ups","Due today, upcoming and overdue",fu()),
call:()=>PG("Rahul Kumar "+T("New"),"B.Tech Foundation · Facebook",`<div class="acts">${btn("📞 Call Now","g")}${btn("Add Note")}${btn("Update Status")}${btn("Schedule Follow-up","p")}${btn("Schedule Meeting")}</div>`+C("Log call outcome",`<div class="chips"><span class="chip on">Connected</span><span class="chip">No answer</span><span class="chip">Busy</span><span class="chip">Call back later</span></div><textarea>Interested in evening batch. Asked about fees.</textarea><p>${btn("Save &amp; schedule follow-up","p")}</p>`))}}};
const root=document.documentElement;
function go(){let [r,v]=(location.hash.slice(1)||"sa-dashboard").split("-");if(!R[r])r="sa";if(!R[r].v[v])v="dashboard";const o=R[r];
$("#rs").value=r;$("#av").textContent=o.n.split(" ").map(w=>w[0]).join("");
$("#sb").innerHTML=`<div class="logo"><i>⚡</i>SalesFlow CRM</div>${o.nav.map(n=>`<a href="#${r}-${n[0]}" class="${n[0]==v?"on":""}">${n[1]} <span>${n[2]}</span></a>`).join("")}<div class="me"><b style="color:#fff">${o.n}</b><br>${o.u}</div>`;
$("#app").innerHTML=o.v[v]();scrollTo(0,0)}
$("#rs").onchange=e=>location.hash=e.target.value+"-dashboard";
document.addEventListener("click",e=>{if(e.target.classList.contains("chip")){[...e.target.parentNode.children].forEach(c=>c.classList.remove("on"));e.target.classList.add("on")}});
addEventListener("hashchange",go);go();
</script></body></html>
