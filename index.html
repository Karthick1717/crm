<html lang="en"><head><meta charset="utf-8"><title>SalesFlow CRM – All Roles</title>

<style>
:root{--pri:#5B4BDB;--bg:#F7F8FC;--card:#fff;--ok:#16A36A;--warn:#F59E0B;--bad:#DC4C4C;--tx:#17233F;--tx2:#697386;--bd:#E6E9F0;--side:#17233F;--soft:#EEEBFD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#0E1424;--card:#172038;--tx:#EEF0F7;--tx2:#9AA3B8;--bd:#263250;--side:#0A0F1D;--soft:#26224F;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
aside{position:fixed;inset:0 auto 0 0;width:232px;background:var(--side);color:#C9CFE0;padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:17px;padding:0 8px 16px}.logo i{width:30px;height:30px;border-radius:8px;background:var(--pri);display:grid;place-items:center;font-style:normal}
aside a{display:flex;gap:10px;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500}aside a.on{background:var(--pri);color:#fff}aside a:hover:not(.on){background:#ffffff14}
.me{margin-top:auto;padding:10px;font-size:12px;border-top:1px solid #ffffff22}
main{margin-left:232px;min-height:100vh}
header{display:flex;gap:14px;align-items:center;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header input,select{padding:8px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}header input{flex:1;max-width:340px}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.pg{padding:24px 28px;max-width:1300px}.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--tx2);margin:0 0 20px}h3{margin:0}
.grid{display:grid;gap:14px;margin-bottom:14px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:1.4fr 1fr}.pl{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}.kpi small{color:var(--tx2);display:block}.kpi b{font-size:25px}.kpi.w b{color:var(--bad)}.kpi.g b{color:var(--ok)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 13px;font:600 13px Inter,sans-serif;cursor:pointer}.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.g{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.s{padding:5px 9px;font-size:12px}.btn.d{color:var(--bad)}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.New{background:#E3EEFF;color:#2563EB}.Contacted{background:#EEEBFD;color:var(--pri)}.Interested{background:#DDF4F1;color:#0F8F86}.Follow-up,.Pending,.Trial{background:#FEF1D6;color:#B87503}.Converted,.Active,.Paid{background:#DDF5EA;color:var(--ok)}.Lost,.Overdue,.Expired,.Failed{background:#FBE4E4;color:var(--bad)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--tx2);font-weight:500;font-size:12px;padding:8px}td{padding:11px 8px;border-top:1px solid var(--bd)}.scroll{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-bottom:22px}.bars div{flex:1;background:var(--pri);border-radius:6px 6px 0 0;opacity:.85;position:relative}.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--tx2)}
.plan{position:relative}.plan.pop{border:2px solid var(--pri)}.plan .pr{font-size:30px;font-weight:700;margin:6px 0}.plan .pr small{font-size:13px;color:var(--tx2);font-weight:400}.plan ul{padding-left:18px;margin:10px 0 16px;color:var(--tx2)}.plan ul li{margin:4px 0}.plan .btn{width:100%;margin-top:6px}
.ribbon{position:absolute;top:-11px;right:14px;background:var(--pri);color:#fff;font-size:11px;font-weight:600;border-radius:20px;padding:2px 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--bd);border-radius:20px;padding:5px 12px;cursor:pointer;background:var(--card);color:var(--tx);font:500 13px Inter,sans-serif}.chip.on{background:var(--soft);border-color:var(--pri);color:var(--pri)}
textarea{width:100%;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--bg);color:var(--tx);font:inherit;min-height:64px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}.row>div:first-child{flex:1}.row small{color:var(--tx2);display:block}
.pb{height:8px;background:var(--bd);border-radius:5px;min-width:90px}.pb i{display:block;height:8px;background:var(--pri);border-radius:5px}
.fl{display:block;margin-bottom:12px;font-weight:500}.fl input,.fl select{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:16px}.md{background:var(--card);border-radius:14px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:99;font-weight:600}
.tgl{border-radius:20px;padding:4px 12px;cursor:pointer;font-weight:600;background:var(--bd);color:var(--tx2)}.tgl.on{background:var(--ok);color:#fff}
.dot{position:relative;top:-8px;left:-4px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
body.au aside,body.au header{display:none}body.au main{margin:0;padding:0}.auw{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#17233F,#5B4BDB)}.auc{background:var(--card);border-radius:16px;padding:32px;width:100%;max-width:440px}.auc.wd{max-width:980px}.auw .back a{color:#fff}.lk{display:block;text-align:center;text-decoration:none}.otp{display:flex;gap:10px;justify-content:center;margin:16px 0}.otp i{width:44px;height:52px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;font:600 20px Inter,sans-serif}
.ml{display:flex;gap:8px;align-items:center;overflow-x:auto}.ml>*{flex-shrink:0}
@media(max-width:820px){aside{inset:auto 0 0 0;width:auto;flex-direction:row;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:9}.logo,.me{display:none}aside a{flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:6px 4px}aside{overflow-x:auto;justify-content:flex-start}aside a{flex-shrink:0}main{margin:0;padding-bottom:80px}header{padding:10px 14px}header input{display:none}.pg{padding:16px}.two{grid-template-columns:1fr}}
